[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "botified-asr"
version = "0.0.0"
description = "Independent Botified ASR service"
requires-python = "==3.11.13"
dependencies = [
  "funasr==1.3.29",
  "numpy==2.4.6",
  "python-multipart==0.0.20",
  "pyyaml==6.0.2",
  "starlette==0.47.2",
  "torch==2.11.0+cpu",
  "torchaudio==2.11.0+cpu",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "openai==1.97.1",
  "pytest==8.4.1",
]

[project.scripts]
botified-asr = "botified_asr.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/botified_asr"]

[tool.uv]
required-version = "==0.9.26"
no-build-package = ["funasr"]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
