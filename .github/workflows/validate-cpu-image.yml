name: Validate CPU image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated CPU image
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ inputs.publish && 'botified-asr-cpu-publish' || format('botified-asr-cpu-validate-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      project_version: ${{ steps.version.outputs.project_version }}
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate project version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = "true" ]; then
            test "$GITHUB_REPOSITORY" = "lzjever/botified-asr"
            test "$GITHUB_REF" = "refs/heads/main"
          fi

          version="$(
            python3 - <<'PY'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]

          if not isinstance(version, str) or re.fullmatch(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",
              version,
          ) is None:
              raise SystemExit(f"project.version must be canonical X.Y.Z, got {version!r}")
          print(version)
          PY
          )"
          printf 'project_version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'release_version=v%s\n' "$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.image_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image_arch: amd64
            uname_arch: x86_64
          - runner: ubuntu-24.04-arm
            image_arch: arm64
            uname_arch: aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.uname_arch }}"

      - name: Export image versions
        shell: bash
        run: |
          set -euo pipefail
          printf 'BOTIFIED_ASR_VERSION=%s\n' \
            '${{ needs.prepare.outputs.project_version }}' \
            >> "$GITHUB_ENV"
          printf 'BOTIFIED_ASR_RELEASE_VERSION=%s\n' \
            '${{ needs.prepare.outputs.release_version }}' \
            >> "$GITHUB_ENV"

      - name: Authenticate staging registry
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lzjever/botified-asr"
          test "$GITHUB_REF" = "refs/heads/main"

          printf '%s' "$GITHUB_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build CPU image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --no-cache \
            --provenance=false \
            --build-arg BOTIFIED_ASR_VERSION="$BOTIFIED_ASR_VERSION" \
            -t botified-asr:test \
            .

      - name: Verify image metadata and CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(
            docker image inspect \
              --format '{{.Architecture}}' \
              botified-asr:test
          )" = "${{ matrix.image_arch }}"
          test "$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
              botified-asr:test
          )" = "$BOTIFIED_ASR_VERSION"
          test "$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.source"}}' \
              botified-asr:test
          )" = "https://github.com/lzjever/botified-asr"
          test "$(
            docker image inspect \
              --format '{{.Config.User}}' \
              botified-asr:test
          )" = "10001:10001"
          test "$(
            docker run \
              --rm \
              --network none \
              --read-only \
              botified-asr:test \
              --version
          )" = "botified-asr $BOTIFIED_ASR_VERSION"
          docker run \
            --rm \
            --network none \
            --read-only \
            --entrypoint test \
            botified-asr:test \
            -r /usr/share/doc/botified-asr/LICENSE
          docker run \
            --rm \
            --network none \
            --read-only \
            --entrypoint test \
            botified-asr:test \
            -r /usr/share/doc/botified-asr/THIRD_PARTY_NOTICES

      - name: Run authenticated transcription smoke
        shell: bash
        run: |
          set -euo pipefail

          container_name="botified-asr-cpu-validation"
          runtime_root="${{ runner.temp }}/botified-asr-validation"
          config_dir="$runtime_root/config"
          data_dir="$runtime_root/data"
          model_cache_dir="$runtime_root/model-cache"
          config_path="$config_dir/config.yaml"
          health_response="$runtime_root/health.json"
          transcription_response="$runtime_root/transcription.json"

          mkdir -p "$config_dir" "$data_dir" "$model_cache_dir"
          sudo chown -R 10001:10001 "$data_dir" "$model_cache_dir"

          cat > "$config_path" <<'YAML'
          server:
            listen: "0.0.0.0:17770"
            public_base_url: "http://127.0.0.1:17770"

          runtime:
            device: "cpu"
            model_cache_dir: "/var/cache/botified-asr/models"
            inference_lanes: 1

          storage:
            data_dir: "/var/lib/botified-asr"
          YAML

          on_exit() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ] \
              && docker container inspect "$container_name" >/dev/null 2>&1; then
              docker logs "$container_name" || true
            fi
            exit "$status"
          }
          trap on_exit EXIT

          export BOTIFIED_ASR_API_KEY="$(
            python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
          )"

          docker run \
            --detach \
            --name "$container_name" \
            --read-only \
            --memory 8g \
            --network bridge \
            --publish 127.0.0.1::17770 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777 \
            --mount \
              "type=bind,src=$config_path,dst=/etc/botified-asr/config.yaml,readonly" \
            --mount \
              "type=bind,src=$data_dir,dst=/var/lib/botified-asr" \
            --mount \
              "type=bind,src=$model_cache_dir,dst=/var/cache/botified-asr/models" \
            --env BOTIFIED_ASR_API_KEY \
            botified-asr:test \
            --config /etc/botified-asr/config.yaml

          host_port="$(
            docker container inspect \
              --format '{{(index (index .NetworkSettings.Ports "17770/tcp") 0).HostPort}}' \
              "$container_name"
          )"
          test -n "$host_port"

          ready=false
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(
              curl \
                --silent \
                --max-time 5 \
                --output "$health_response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $BOTIFIED_ASR_API_KEY" \
                "http://127.0.0.1:$host_port/health/ready" \
                || true
            )" = "200" ]; then
              ready=true
              break
            fi
            if [ "$(
              docker container inspect \
                --format '{{.State.Running}}' \
                "$container_name"
            )" != "true" ]; then
              break
            fi
            sleep 5
          done
          test "$ready" = "true"

          test "$(
            curl \
              --silent \
              --show-error \
              --max-time 300 \
              --output "$transcription_response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $BOTIFIED_ASR_API_KEY" \
              --form model=sensevoice \
              --form \
                file=@assets/botified-asr-smoke.flac\;type=audio/flac \
              "http://127.0.0.1:$host_port/v1/audio/transcriptions"
          )" = "200"

          python3 - "$transcription_response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              text = json.load(source).get("text")
          raise SystemExit(not isinstance(text, str) or not text.strip())
          PY

          trap - EXIT

      - name: Push validated architecture image
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lzjever/botified-asr"
          test "$GITHUB_REF" = "refs/heads/main"

          image="ghcr.io/lzjever/botified-asr"
          staging_ref="$image:staging-${GITHUB_RUN_ID}-${{ matrix.image_arch }}"
          docker tag botified-asr:test "$staging_ref"
          docker push "$staging_ref"

          inspect_output="$(docker buildx imagetools inspect "$staging_ref")"
          digest="$(
            awk '$1 == "Digest:" { print $2; exit }' \
              <<< "$inspect_output"
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          raw_manifest="$(mktemp)"
          docker buildx imagetools inspect "$staging_ref" --raw \
            > "$raw_manifest"
          python3 - "$raw_manifest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)

          allowed_media_types = {
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
          }
          if manifest.get("mediaType") not in allowed_media_types:
              raise SystemExit("staging reference is not a single image manifest")
          if "manifests" in manifest:
              raise SystemExit("staging reference unexpectedly contains an image index")
          PY

          docker logout ghcr.io
          docker buildx imagetools inspect "$image@$digest" >/dev/null

      - name: Stop validation container
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          container_name="botified-asr-cpu-validation"
          if docker container inspect "$container_name" >/dev/null 2>&1; then
            docker stop --time 120 "$container_name" || true
            docker rm "$container_name" \
              || docker rm --force "$container_name" \
              || true
          fi

      - name: Remove registry credentials
        if: ${{ always() && inputs.publish }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  publish:
    name: Publish CPU image
    needs:
      - prepare
      - validate
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create and verify staging multi-architecture image
        id: staging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lzjever/botified-asr"
          test "$GITHUB_REF" = "refs/heads/main"

          image="ghcr.io/lzjever/botified-asr"
          printf '%s' "$GITHUB_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          inspect_single_manifest() {
            local reference="$1"
            local inspect_output
            local digest
            local raw_manifest

            inspect_output="$(docker buildx imagetools inspect "$reference")" \
              || return 1
            digest="$(
              awk '$1 == "Digest:" { print $2; exit }' \
                <<< "$inspect_output"
            )" || return 1
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1

            raw_manifest="$(mktemp)" || return 1
            docker buildx imagetools inspect "$reference" --raw \
              > "$raw_manifest" \
              || return 1
            python3 - "$raw_manifest" <<'PY' || return 1
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              manifest = json.load(source)

          allowed_media_types = {
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
          }
          if manifest.get("mediaType") not in allowed_media_types:
              raise SystemExit("staging reference is not a single image manifest")
          if "manifests" in manifest:
              raise SystemExit("staging reference unexpectedly contains an image index")
          PY
            printf '%s\n' "$digest"
          }

          amd64_ref="$image:staging-${GITHUB_RUN_ID}-amd64"
          arm64_ref="$image:staging-${GITHUB_RUN_ID}-arm64"
          amd64_digest="$(inspect_single_manifest "$amd64_ref")"
          arm64_digest="$(inspect_single_manifest "$arm64_ref")"
          test "$amd64_digest" != "$arm64_digest"

          staging_index_ref="$image:staging-${GITHUB_RUN_ID}-index"
          metadata_file="$(mktemp)"
          docker buildx imagetools create \
            --tag "$staging_index_ref" \
            --metadata-file "$metadata_file" \
            "$image@$amd64_digest" \
            "$image@$arm64_digest"

          index_digest="$(
            python3 - "$metadata_file" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              descriptor = json.load(source).get("containerimage.descriptor")
          digest = descriptor.get("digest") if isinstance(descriptor, dict) else None
          if not isinstance(digest, str) or re.fullmatch(
              r"sha256:[0-9a-f]{64}", digest
          ) is None:
              raise SystemExit("imagetools metadata omitted a valid image digest")
          print(digest)
          PY
          )"
          test "$index_digest" != "$amd64_digest"
          test "$index_digest" != "$arm64_digest"

          inspect_output="$(docker buildx imagetools inspect "$staging_index_ref")"
          inspected_digest="$(
            awk '$1 == "Digest:" { print $2; exit }' \
              <<< "$inspect_output"
          )"
          test "$inspected_digest" = "$index_digest"

          staging_index="$(mktemp)"
          docker buildx imagetools inspect "$image@$index_digest" --raw \
            > "$staging_index"
          python3 \
            - "$staging_index" "$amd64_digest" "$arm64_digest" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              index = json.load(source)

          allowed_media_types = {
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.index.v1+json",
          }
          if index.get("mediaType") not in allowed_media_types:
              raise SystemExit("staging reference is not an image index")

          manifests = index.get("manifests")
          if not isinstance(manifests, list) or len(manifests) != 2:
              raise SystemExit("staging image index must contain exactly two manifests")

          expected = {
              ("linux", "amd64"): sys.argv[2],
              ("linux", "arm64"): sys.argv[3],
          }
          actual = {
              (
                  item.get("platform", {}).get("os"),
                  item.get("platform", {}).get("architecture"),
              ): item.get("digest")
              for item in manifests
          }
          if actual != expected:
              raise SystemExit(
                  f"unexpected staging image platforms or digests: {actual!r}"
              )
          PY

          {
            printf 'index_digest=%s\n' "$index_digest"
            printf 'amd64_digest=%s\n' "$amd64_digest"
            printf 'arm64_digest=%s\n' "$arm64_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify release bundle
        env:
          AMD64_DIGEST: ${{ steps.staging.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.staging.outputs.arm64_digest }}
          BOTIFIED_ASR_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          INDEX_DIGEST: ${{ steps.staging.outputs.index_digest }}
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/lzjever/botified-asr"
          release_dir="$RUNNER_TEMP/botified-asr-release"
          mkdir "$release_dir"
          cp LICENSE THIRD_PARTY_NOTICES assets/botified-asr-smoke.flac \
            "$release_dir/"

          python_container=(
            --rm
            --network none
            --read-only
            --user "$(id -u):$(id -g)"
            --env PYTHONDONTWRITEBYTECODE=1
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
            --mount "type=bind,src=$release_dir,dst=/release"
            --entrypoint python3
            "$image@$AMD64_DIGEST"
          )
          docker run "${python_container[@]}" \
            /workspace/scripts/build-skill-tarball \
            /release/botified-asr-skill.tar.gz
          docker run "${python_container[@]}" \
            /workspace/scripts/generate-openapi \
            /release/botified-asr-openapi.json
          docker run "${python_container[@]}" \
            /workspace/scripts/generate-release-manifest \
            --license /release/LICENSE \
            --notices /release/THIRD_PARTY_NOTICES \
            --openapi /release/botified-asr-openapi.json \
            --skill /release/botified-asr-skill.tar.gz \
            --smoke /release/botified-asr-smoke.flac \
            --index-digest "$INDEX_DIGEST" \
            --amd64-digest "$AMD64_DIGEST" \
            --arm64-digest "$ARM64_DIGEST" \
            --release-version "$BOTIFIED_ASR_RELEASE_VERSION" \
            --output /release/botified-asr-release.json

          python3 \
            - "$release_dir" \
            "$BOTIFIED_ASR_RELEASE_VERSION" \
            "$INDEX_DIGEST" \
            "$AMD64_DIGEST" \
            "$ARM64_DIGEST" <<'PY'
          import hashlib
          import json
          import stat
          import sys
          from pathlib import Path

          release_dir = Path(sys.argv[1])
          release_version, index_digest, amd64_digest, arm64_digest = sys.argv[2:]
          artifact_names = {
              "LICENSE",
              "THIRD_PARTY_NOTICES",
              "botified-asr-openapi.json",
              "botified-asr-skill.tar.gz",
              "botified-asr-smoke.flac",
          }
          expected_members = artifact_names | {"botified-asr-release.json"}
          members = {path.name for path in release_dir.iterdir()}
          if members != expected_members:
              raise SystemExit(f"unexpected release bundle members: {members!r}")
          for name in expected_members:
              metadata = (release_dir / name).lstat()
              if not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit(f"release bundle member is not a regular file: {name}")

          with (release_dir / "botified-asr-release.json").open(
              encoding="utf-8"
          ) as source:
              manifest = json.load(source)
          expected_artifacts = {}
          for name in artifact_names:
              with (release_dir / name).open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              expected_artifacts[name] = {"sha256": digest}
          if manifest.get("artifacts") != expected_artifacts:
              raise SystemExit("release manifest artifact hashes do not match")
          if manifest.get("release_version") != release_version:
              raise SystemExit("release manifest version does not match")
          expected_image = {
              "index_digest": index_digest,
              "platforms": {
                  "linux/amd64": {
                      "device": "cpu",
                      "digest": amd64_digest,
                  },
                  "linux/arm64": {
                      "device": "cpu",
                      "digest": arm64_digest,
                  },
              },
              "repository": "ghcr.io/lzjever/botified-asr",
          }
          if manifest.get("oci_image") != expected_image:
              raise SystemExit("release manifest OCI image does not match")
          PY

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: botified-asr-${{ needs.prepare.outputs.release_version }}
          path: ${{ runner.temp }}/botified-asr-release
          if-no-files-found: error
          overwrite: true

      - name: Publish stable multi-architecture image
        env:
          BOTIFIED_ASR_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          GITHUB_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ steps.staging.outputs.index_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "lzjever/botified-asr"
          test "$GITHUB_REF" = "refs/heads/main"

          image="ghcr.io/lzjever/botified-asr"
          stable_ref="$image:$BOTIFIED_ASR_RELEASE_VERSION"
          registry_token="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --get \
              --user "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              --data-urlencode service=ghcr.io \
              --data-urlencode \
                scope=repository:lzjever/botified-asr:pull,push \
              https://ghcr.io/token \
              | python3 -c \
                'import json, sys; token = json.load(sys.stdin).get("token"); print(token) if token else sys.exit("GHCR response omitted bearer token")'
          )"

          headers="$(mktemp)"
          status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              --head \
              --header "Authorization: Bearer $registry_token" \
              --header \
                'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/lzjever/botified-asr/manifests/$BOTIFIED_ASR_RELEASE_VERSION"
          )"
          case "$status" in
            404)
              publish_stable=true
              ;;
            200)
              digest="$(
                awk \
                  'BEGIN { IGNORECASE = 1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2 }' \
                  "$headers" \
                  | tail -n 1
              )"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              if [ "$digest" != "$INDEX_DIGEST" ]; then
                printf 'Stable image %s already exists at different digest %s\n' \
                  "$stable_ref" "$digest" >&2
                exit 1
              fi
              publish_stable=false
              ;;
            *)
              printf 'Unexpected GHCR manifest status: %s\n' "$status" >&2
              exit 1
              ;;
          esac

          if [ "$publish_stable" = "true" ]; then
            docker buildx imagetools inspect "$image@$INDEX_DIGEST" >/dev/null
            docker buildx imagetools create \
              --tag "$stable_ref" \
              "$image@$INDEX_DIGEST"
          fi

          inspect_output="$(docker buildx imagetools inspect "$stable_ref")"
          stable_digest="$(
            awk '$1 == "Digest:" { print $2; exit }' \
              <<< "$inspect_output"
          )"
          [[ "$stable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$stable_digest" = "$INDEX_DIGEST"

      - name: Remove registry credentials
        if: ${{ always() && inputs.publish }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
